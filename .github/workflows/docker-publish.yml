name: build-and-publish

# main에 커밋(머지)될 때마다 테스트 후 도커 이미지를 GHCR에 올린다.
# 서버(EC2)가 1분마다 새 이미지를 확인해 자동으로 교체하므로 AWS 자격증명은 필요 없다.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew --no-daemon test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/likelion-yonsei-14th/14-demoday-backend-chak:latest
            ghcr.io/likelion-yonsei-14th/14-demoday-backend-chak:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
