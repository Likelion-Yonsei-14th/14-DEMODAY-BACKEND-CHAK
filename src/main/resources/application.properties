spring.application.name=chak
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chak?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

spring.jackson.time-zone=Asia/Seoul
server.forward-headers-strategy=framework

jwt.secret=${JWT_SECRET:chak-local-development-secret-key-must-be-changed-2026}
jwt.access-token-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:1800}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:2592000}

kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.token-uri=https://kauth.kakao.com/oauth/token
kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

chak.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

storage.s3.bucket=${S3_BUCKET:}
storage.s3.region=${AWS_REGION:ap-northeast-2}
storage.s3.endpoint=${S3_ENDPOINT:}
storage.s3.force-path-style=${S3_FORCE_PATH_STYLE:false}
storage.presign-expiration-seconds=${STORAGE_PRESIGN_EXPIRATION_SECONDS:600}
chak.admin-kakao-ids=${ADMIN_KAKAO_IDS:}

chak.guest-cookie.name=chak_guest_id
chak.guest-cookie.max-age-seconds=31536000
chak.guest-cookie.secure=${GUEST_COOKIE_SECURE:false}
