# SPRING_PROFILES_ACTIVE=prod 일 때 적용되는 운영 기본값 (환경변수로 재정의 가능)
chak.guest-cookie.secure=${GUEST_COOKIE_SECURE:true}
chak.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
# 리프레시 토큰은 HttpOnly 쿠키로만 준다. 본문에도 넣으면 XSS 한 번으로 토큰이 새므로 운영에서는 끈다(프런트는 본문 값을 쓰지 않는다).
chak.refresh-cookie.include-in-body=${REFRESH_TOKEN_IN_BODY:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
chak.payment.provider=${PAYMENT_PROVIDER:none}
chak.chaltteok.provider=${CHALTTEOK_PROVIDER:none}
chak.alert.environment=${ALERT_ENVIRONMENT:prod}

# 시작 시 AWS Secrets Manager의 앱 시크릿을 설정으로 읽는다(환경변수가 우선, 못 읽어도 기동은 계속).
chak.secrets.id=${CHAK_SECRETS_ID:chak/prod/app}

# RDS가 관리하는 DB 계정 시크릿(7일마다 비밀번호 자동 교체). 시작할 때와 5분마다 최신 비밀번호를 읽는다.
# DB를 새로 만들면 이름이 바뀌므로 DB_SECRET_ID로 재정의한다. 비우면 환경변수의 DB_PASSWORD만 쓴다.
chak.db-secret-id=${DB_SECRET_ID:rds!db-9df05f2c-dac1-4d8b-9969-9bf0fc7b4f47}

# DB 연결 풀: 기본값(대기 30초)이면 DB가 막혔을 때 요청 스레드가 30초씩 쌓여 서버 전체가 느려진다. 빨리 실패시키고 죽은 연결은 교체한다.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.data-source-properties.connectTimeout=3000
spring.datasource.hikari.data-source-properties.socketTimeout=20000
