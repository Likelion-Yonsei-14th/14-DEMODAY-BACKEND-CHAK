spring.application.name=chak
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chak?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

spring.jackson.time-zone=Asia/Seoul
server.forward-headers-strategy=framework

jwt.secret=${JWT_SECRET:chak-local-development-secret-key-must-be-changed-2026}
jwt.access-token-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:1800}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:2592000}

kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.token-uri=https://kauth.kakao.com/oauth/token
kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.token-uri=https://oauth2.googleapis.com/token
google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo

chak.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

storage.s3.bucket=${S3_BUCKET:}
storage.s3.region=${AWS_REGION:ap-northeast-2}
storage.s3.endpoint=${S3_ENDPOINT:}
storage.s3.force-path-style=${S3_FORCE_PATH_STYLE:false}
storage.presign-expiration-seconds=${STORAGE_PRESIGN_EXPIRATION_SECONDS:600}
chak.admin-kakao-ids=${ADMIN_KAKAO_IDS:}
chak.admin-google-ids=${ADMIN_GOOGLE_IDS:}
chak.load-test.provision-key=${LOAD_TEST_PROVISION_KEY:}

chak.refresh-cookie.name=chak_refresh_token
chak.refresh-cookie.path=/api/auth
chak.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
chak.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
chak.refresh-cookie.include-in-body=${REFRESH_TOKEN_IN_BODY:true}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

chak.guest-cookie.name=chak_guest_id
chak.guest-cookie.max-age-seconds=31536000
chak.guest-cookie.secure=${GUEST_COOKIE_SECURE:false}
chak.guest-cookie.same-site=${GUEST_COOKIE_SAME_SITE:Lax}

chak.payment.provider=${PAYMENT_PROVIDER:mock}

# 찰떡 충전 결제: none(거부) | mock(가짜 승인) | toss(토스페이먼츠, TOSS_SECRET_KEY 필요)
chak.chaltteok.provider=${CHALTTEOK_PROVIDER:mock}
toss.secret-key=${TOSS_SECRET_KEY:}
toss.payments-url=https://api.tosspayments.com/v1/payments

# 운영자 알림(디스코드 웹훅). 비워 두면 로그로만 남김
chak.alert.discord-webhook-url=${DISCORD_WEBHOOK_URL:}
chak.alert.environment=${ALERT_ENVIRONMENT:local}
