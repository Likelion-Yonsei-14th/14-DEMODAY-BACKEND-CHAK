AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CHAK backend - EC2 (Docker) + RDS MySQL + S3 media bucket + CloudFront (HTTPS).
  The server pulls the image that GitHub Actions publishes to GHCR and updates itself
  once a minute, so no AWS credentials are needed in GitHub.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to use (the default VPC is fine).
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different availability zones of that VPC.
  CloudFrontPrefixListId:
    Type: String
    Description: ID of the AWS-managed prefix list com.amazonaws.global.cloudfront.origin-facing in this region.
  FrontendOrigin:
    Type: String
    Default: https://14-demoday-frontend-chak.vercel.app
    Description: Origin of the frontend (used for CORS on the API and on the media bucket).
  ImageRepository:
    Type: String
    Default: ghcr.io/likelion-yonsei-14th/14-demoday-backend-chak
    Description: Container image (lowercase) that the server runs and keeps up to date.
  InstanceType:
    Type: String
    Default: t3.small
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  PaymentProvider:
    Type: String
    Default: none
    AllowedValues: [none, mock]
    Description: "none rejects all payments. mock approves fake payments (demo only, no real money)."

Resources:
  # ---- secrets (generated by AWS; nobody types them) ----
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: chak/prod/app
      Description: CHAK backend secrets. JWT_SECRET is generated; fill in the Kakao values after deploy.
      GenerateSecretString:
        SecretStringTemplate: '{"KAKAO_CLIENT_ID":"","KAKAO_CLIENT_SECRET":"","ADMIN_KAKAO_IDS":""}'
        GenerateStringKey: JWT_SECRET
        PasswordLength: 64
        ExcludePunctuation: true

  # ---- network ----
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CHAK server - HTTP only from CloudFront
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CHAK database - MySQL only from the server
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref InstanceSecurityGroup

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CHAK database subnets
      SubnetIds: !Ref SubnetIds

  # ---- database ----
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      EngineVersion: '8.0.42'
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: chak
      MasterUsername: chak_admin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true

  # ---- media bucket (private; the app hands out short-lived signed URLs) ----
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref FrontendOrigin]
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: expire-unfinished-uploads
            Status: Enabled
            Prefix: tmp/
            ExpirationInDays: 1
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # ---- server ----
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: chak-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppSecret
                  - !GetAtt Database.MasterUserSecret.SecretArn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${MediaBucket.Arn}/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Server:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Select [0, !Ref SubnetIds]
          GroupSet: [!Ref InstanceSecurityGroup]
      Tags:
        - Key: Name
          Value: chak-server
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker jq
          systemctl enable --now docker
          mkdir -p /opt/chak

          # ---- start (or restart) the app container with secrets read at run time ----
          cat > /opt/chak/run.sh <<'RUNEOF'
          #!/bin/bash
          set -euo pipefail
          REGION="${AWS::Region}"
          get() { aws secretsmanager get-secret-value --region "$REGION" --secret-id "$1" --query SecretString --output text; }
          APP=$(get "${AppSecret}")
          DB=$(get "${Database.MasterUserSecret.SecretArn}")
          umask 077
          {
            echo "SPRING_PROFILES_ACTIVE=prod"
            echo "JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Seoul -Xmx768m"
            echo "DB_URL=jdbc:mysql://${Database.Endpoint.Address}:3306/chak?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
            echo "DB_USERNAME=$(jq -r .username <<<"$DB")"
            echo "DB_PASSWORD=$(jq -r .password <<<"$DB")"
            echo "JWT_SECRET=$(jq -r .JWT_SECRET <<<"$APP")"
            echo "KAKAO_CLIENT_ID=$(jq -r .KAKAO_CLIENT_ID <<<"$APP")"
            echo "KAKAO_CLIENT_SECRET=$(jq -r .KAKAO_CLIENT_SECRET <<<"$APP")"
            echo "ADMIN_KAKAO_IDS=$(jq -r .ADMIN_KAKAO_IDS <<<"$APP")"
            echo "S3_BUCKET=${MediaBucket}"
            echo "AWS_REGION=$REGION"
            echo "CORS_ALLOWED_ORIGINS=${FrontendOrigin}"
            echo "PAYMENT_PROVIDER=${PaymentProvider}"
          } > /run/chak.env
          docker rm -f chak >/dev/null 2>&1 || true
          docker run -d --name chak --restart unless-stopped -p 80:8080 --env-file /run/chak.env \
            --log-opt max-size=10m --log-opt max-file=3 "${ImageRepository}:latest" >/dev/null
          rm -f /run/chak.env
          RUNEOF

          # ---- once a minute: pull the newest image, swap it in, roll back if it does not become healthy ----
          cat > /opt/chak/update.sh <<'UPDEOF'
          #!/bin/bash
          set -uo pipefail
          IMAGE="${ImageRepository}:latest"
          BAD=/opt/chak/bad-image
          current=$(docker image inspect --format '{{.Id}}' "$IMAGE" 2>/dev/null || echo none)
          docker pull -q "$IMAGE" >/dev/null 2>&1 || exit 0
          latest=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          if [ "$latest" = "$current" ] && docker ps -q -f name='^chak$' | grep -q .; then exit 0; fi
          if [ -f "$BAD" ] && [ "$(cat $BAD)" = "$latest" ]; then exit 0; fi
          /opt/chak/run.sh
          for i in $(seq 1 40); do
            if curl -fs http://localhost/api/public/health >/dev/null; then rm -f "$BAD"; exit 0; fi
            sleep 3
          done
          echo "$latest" > "$BAD"
          if [ "$current" != none ]; then docker tag "$current" "$IMAGE"; /opt/chak/run.sh; fi
          UPDEOF
          chmod +x /opt/chak/run.sh /opt/chak/update.sh

          cat > /etc/systemd/system/chak-update.service <<'SVCEOF'
          [Unit]
          Description=Pull and start the newest CHAK image
          After=docker.service network-online.target
          [Service]
          Type=oneshot
          ExecStart=/opt/chak/update.sh
          SVCEOF
          cat > /etc/systemd/system/chak-update.timer <<'TMREOF'
          [Unit]
          Description=Check for a new CHAK image every minute
          [Timer]
          OnBootSec=30
          OnUnitActiveSec=60
          [Install]
          WantedBy=timers.target
          TMREOF
          systemctl daemon-reload
          systemctl enable --now chak-update.timer

  # ---- HTTPS front door (default *.cloudfront.net certificate) ----
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: chak-api
        PriceClass: PriceClass_200
        HttpVersion: http2and3
        Origins:
          - Id: server
            DomainName: !GetAtt Server.PublicDnsName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: server
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3   # Managed-AllViewer
          Compress: true

Outputs:
  ApiUrl:
    Description: Public HTTPS address of the backend
    Value: !Sub 'https://${Distribution.DomainName}'
  ServerInstanceId:
    Value: !Ref Server
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  MediaBucketName:
    Value: !Ref MediaBucket
  AppSecretName:
    Value: chak/prod/app
