spring.application.name=chak
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chak?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=Asia/Seoul
server.forward-headers-strategy=framework

chak.guest-cookie.name=chak_guest_id
chak.guest-cookie.max-age-seconds=31536000
chak.guest-cookie.secure=${GUEST_COOKIE_SECURE:false}
