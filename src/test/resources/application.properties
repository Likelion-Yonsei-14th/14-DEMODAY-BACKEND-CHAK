spring.datasource.url=jdbc:h2:mem:chak;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.main.allow-bean-definition-overriding=true
jwt.secret=chak-test-secret-key-long-enough-for-hs256-signature
jwt.access-token-expiration-seconds=1800
jwt.refresh-token-expiration-seconds=2592000
kakao.client-id=test-client-id
kakao.client-secret=
kakao.token-uri=https://kauth.kakao.com/oauth/token
kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
chak.cors.allowed-origins=http://localhost:3000
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

chak.guest-cookie.name=chak_guest_id
chak.guest-cookie.max-age-seconds=31536000
chak.guest-cookie.secure=false
